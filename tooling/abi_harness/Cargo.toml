[package]
name = "roc-golem-abi-harness"
version = "0.1.0"
edition = "2021"
description = "Runs a built roc-golem component outside Golem to check the Roc-to-Rust ABI"
publish = false

[[bin]]
name = "abi_harness"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
wasmtime = { version = "49.0.2", features = ["component-model"] }
