[package]
name = "roc-golem-abi-harness"
version = "0.1.0"
edition = "2021"
description = "Runs a built roc-golem component outside Golem to check the Roc-to-Rust ABI"
publish = false

[[bin]]
name = "abi_harness"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
pollster = "0.4"
# Match the wasmtime major that Golem 1.6 runs (WASI P3 + async component
# model): components that import async host functions trap under newer
# wasmtime majors whose async ABI has moved on.
wasmtime = { version = "46", features = ["component-model", "component-model-async"] }
