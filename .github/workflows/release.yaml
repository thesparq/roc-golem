name: Release Platform

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y lld brotli zstd
          if ! command -v wasm-ld &>/dev/null; then
            sudo ln -s "$(which lld)" /usr/local/bin/wasm-ld || true
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.222.0"

      - name: Cache Roc Compiler
        id: cache-roc
        uses: actions/cache@v4
        with:
          path: ~/.roc-cache
          key: roc-nightly-2026-09-29-7f11a82

      - name: Install Pinned Roc Nightly
        if: steps.cache-roc.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.roc-cache"
          curl -fsSL https://github.com/roc-lang/nightlies/releases/download/nightly-2026-09-29-7f11a82/roc_nightly-linux_x86_64-2026-09-29-7f11a82.tar.gz | tar -xz -C "$HOME/.roc-cache" --strip-components=1

      - name: Add Roc to PATH
        run: |
          echo "$HOME/.roc-cache" >> "$GITHUB_PATH"

      - name: Run Host Unit Tests
        run: cargo test --manifest-path host/Cargo.toml --features stub-guest --lib

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Platform & Package Release
        run: |
          ./tooling/build.sh release "${{ steps.vars.outputs.tag }}" "${{ github.repository }}"

      - name: Verify Packaged Consumer Build
        run: |
          ./tooling/test_consumer.sh "dist/roc-golem-${{ steps.vars.outputs.tag }}.tar.zst"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Roc Golem Platform ${{ steps.vars.outputs.tag }}"
          body_path: dist/release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/*.tar.zst
            dist/*.tar.br
            dist/*.tar.gz
            dist/checksums.txt
            build/*_agent.wasm
