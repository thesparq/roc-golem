name: Release Platform

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Package & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install compression tools (brotli, zstd)
        run: sudo apt-get update && sudo apt-get install -y brotli zstd

      - name: Install wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          # >= 1.248.0 is the floor for componentizing the Golem 1.6 async ABI.
          version: "1.248.0"

      - name: Install Roc Nightly
        env:
          # Keep in step with .github/workflows/ci.yaml: the hand-written ABI in
          # `host/src/roc_std.rs` is tied to this compiler version.
          ROC_TAG: nightly-2026-10-19-601b54c
        run: |
          ROC_VERSION="${ROC_TAG#nightly-}"
          mkdir -p "$HOME/roc"
          ROC_URL="https://github.com/roc-lang/nightlies/releases/download/${ROC_TAG}/roc_nightly-linux_x86_64-${ROC_VERSION}.tar.gz"
          curl -fSL "$ROC_URL" | tar -xz -C "$HOME/roc" --strip-components=1
          echo "$HOME/roc" >> "$GITHUB_PATH"

      - name: Run Host Unit Tests
        run: cargo test --manifest-path host/Cargo.toml --lib

      - name: Run Platform Reader Unit Tests
        # The JSON field reader's own tests (`roc test`): the member scan, the
        # unescaped closing quote, and every escape the host's emitter writes.
        # The `\uXXXX` and surrogate cases only exist here — the host writes
        # non-ASCII as raw UTF-8, so an end-to-end run never reaches them.
        #
        # `roc test` exits 2 when it reports a *warning*, and this platform's
        # files still carry module headers, which Roc deprecates (see the
        # "module headers" note in the README's development section). A failing
        # `expect` exits 1 and prints "failed", so the step requires the tests'
        # own summary instead of a zero exit code.
        run: |
          output="$(roc test platform/main.roc 2>&1 || true)"
          printf '%s\n' "$output"
          case "$output" in
            *"tests passed"*) ;;
            *) echo "roc test did not pass"; exit 1 ;;
          esac

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Platform & Package Release
        run: |
          ./tooling/build.sh release "${{ steps.vars.outputs.tag }}" "${{ github.repository }}"

      - name: ABI smoke test
        # Same checks as CI: a release must not ship components that trap on
        # their first call, misreport their agent type, or break a tool call.
        run: |
          cargo build --release --manifest-path tooling/abi_harness/Cargo.toml
          HARNESS=tooling/abi_harness/target/release/abi_harness
          status=0
          check() { "$@" || status=1; }

          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message increment \
            --reply "Counter incremented to 1" \
            --then-reply "Counter incremented to 2" \
            --tool get_count --tool-reply '{"count": 2}'

          # The quota and retry effects are synchronous host imports, so the
          # harness can drive them (unlike the effects agent's async HTTP
          # import): the stubs record what the component asked the host for,
          # including the retry continuation the app threaded through the JSON
          # round trip.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "quota 6" --reply "Committed 6 units" \
            --expect-quota "commit(used=6)" \
            --then-message retry --then-reply '"countBox"' \
            --expect-retry "state=3 bytes"

          # The `golem:api/host` execution-control effects are synchronous too:
          # the resolve stubs answer with a known component id (which the app's
          # reply has to carry back), `oplog-commit` is recorded, and a `trap`
          # fails the invocation — the one failure the harness reports as a trap.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message 'resolve-agent-id roc-golem:counter counter-agent("c-1")' \
            --reply '"componentId":"01020304-0506-0708-090a-0b0c0d0e0f10"' \
            --then-message 'resolve-component-id roc-golem:counter' \
            --then-reply 'Resolved component: 01020304-0506-0708-090a-0b0c0d0e0f10' \
            --expect-host-call 'resolve-agent-id(component=roc-golem:counter, agent=counter-agent("c-1"))'

          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent \
            --message "oplog-commit 2" --reply "Committed the oplog to 2 replicas" \
            --expect-host-call "oplog-commit(replicas=2)"

          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent \
            --message "trap harness trap reason" \
            --expect-trap "harness trap reason" \
            --expect-host-call "trap(reason=harness trap reason)"

          # The key-value and blobstore effects, against the harness's own
          # small store for each: the round-trip replies only come back correct
          # if the values really went in and out of it (the blobstore's
          # `list-objects` stream included).
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "kv harness-bucket harness-key hello kv" \
            --reply "kv set=ok get=hello kv exists=true delete=ok exists-after=false missing=null" \
            --expect-kv "set(bucket=harness-bucket, key=harness-key, 8 bytes)" \
            --then-message "blob harness-blob obj.txt hello blob" \
            --then-reply 'blob create=ok put=ok get=hello blob has=true list=["obj.txt"] delete=ok has-after=false' \
            --expect-blob "write-data(container=harness-blob, object=obj.txt, 10 bytes)"

          # The agent's own filesystem (`wasi:filesystem@0.2.6`) is synchronous
          # too, and the harness keeps an in-memory tree of its own: the file the
          # first message writes has to come back out of that tree in the second
          # — the later invocation reads what the earlier one wrote — and the
          # listing is the JSON array the effect promises.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "fs write notes.txt hello fs" --reply "fs wrote notes.txt" \
            --then-message "fs read notes.txt" --then-reply "fs read: hello fs" \
            --expect-fs "write(path=notes.txt, 8 bytes)"

          # `fileSize!` is the one effect whose result is `Try(U64, Str)`, the
          # tag-union shape the hand-written ABI spells out itself
          # (`RocU64Result`): a wrong layout would surface here as a size that
          # is not the one the write put in.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "fs write notes.txt hello fs" --reply "fs wrote notes.txt" \
            --then-message "fs size notes.txt" --then-reply "fs size: 8" \
            --expect-fs "stat-at(path=notes.txt)"

          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "fs mkdir notes" --reply "fs made dir notes" \
            --then-message "fs list /" \
            --then-reply 'fs list: [{"name":"notes","type":"dir"}]' \
            --expect-fs "create-directory-at(path=notes)"

          # The database effects (`golem:rdbms`) are synchronous host imports
          # too, and the harness keeps a small relational store of its own: the
          # round trip's create/insert/select/count and its rolled-back and
          # committed transactions only come back correct if the params really
          # went into that store and the results came back out, and the recorded
          # calls show which host functions ran.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "db open postgresql://roc@127.0.0.1:5432/roc" \
            --reply "db opened handle 1" \
            --expect-db "postgres open(address=postgresql://roc@127.0.0.1:5432/roc)" \
            --then-message "db roundtrip harness_db postgresql://roc@127.0.0.1:5432/roc" \
            --then-reply 'select1={"columns":[{"dbType":{"tag":"int4"},"dbTypeName":"INT4","name":"id","ordinal":0},{"dbType":{"tag":"text"},"dbTypeName":"TEXT","name":"note","ordinal":1}],"rows":[[{"tag":"int4","value":1},{"tag":"text","value":"hello db"}]]}' \
            --expect-db 'postgres execute(statement=INSERT INTO harness_db (id, note) VALUES ($1, $2), params=[int4(1), text("hello db")])'

          # The same round trip, checking the transaction semantics: the
          # rolled-back row leaves the count alone, the committed one moves it.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "db open postgresql://roc@127.0.0.1:5432/roc" \
            --reply "db opened handle 1" \
            --then-message "db roundtrip harness_db postgresql://roc@127.0.0.1:5432/roc" \
            --then-reply 'count2={"columns":[{"dbType":{"tag":"int8"},"dbTypeName":"INT8","name":"count","ordinal":0}],"rows":[[{"tag":"int8","value":1}]]} begin=ok txn-insert=1 commit=ok count3={"columns":[{"dbType":{"tag":"int8"},"dbTypeName":"INT8","name":"count","ordinal":0}],"rows":[[{"tag":"int8","value":2}]]}' \
            --expect-db "postgres commit"

          # MySQL and Ignite have their own interfaces and their own `open`s;
          # the stub records which one the component called.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent \
            --message "db open-mysql mysql://root@127.0.0.1:3306/roc" \
            --reply "db mysql opened handle 1" \
            --expect-db "mysql open(address=mysql://root@127.0.0.1:3306/roc)" \
            --then-message "db open-ignite ignite://127.0.0.1:10800" \
            --then-reply "db ignite opened handle 2" \
            --expect-db "ignite open(address=ignite://127.0.0.1:10800)"

          # An address Golem cannot parse is the effect's `Err` (the interface's
          # `connection-failure` variant), not a trap.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent \
            --message "db open not-a-database-url" \
            --reply "db open failed: connection-failure"

          # The permission effects (`golem:permissions`) are synchronous host
          # imports too, and the harness keeps a small card table of its own: the
          # `permission roundtrip` command lists the wallet, inspects the card it
          # found, derives a narrowing child, has an over-broad derivation
          # refused, derives a scope card, revokes the child, tries to revoke it
          # again, releases the wallet card and tries to use it again — so the
          # reply only comes back correct if the handles really behaved the way
          # the platform documents, and the recorded calls show which host
          # functions ran (including the drop a release performs).
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "permission principal" --reply '{"tag":"anonymous"}' \
            --then-message "permission wallet" \
            --then-reply '"handle":1' --then-reply '"tag":"template"' \
            --expect-permission "self-wallet() -> 1 card"

          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "permission roundtrip" \
            --reply "wallet: 1 first, template" \
            --reply 'id: "01020304-0506-0709-090a-0b0c0d0e0f11"' \
            --reply 'parents: ["01020304-0506-0708-090a-0b0c0d0e0f10"]' \
            --reply "expires: null" \
            --reply '"className":"filesystem"' \
            --reply "permission narrowing: handle 2" \
            --reply "permission over-broad failed: lower-bound-too-broad" \
            --reply "permission scope: handle 3" \
            --reply "permission revoke: revoked 1 card(s)" \
            --reply "permission revoke failed: unknown permission card handle 2" \
            --reply "permission release failed: unknown permission card handle 1" \
            --reply "permission validate: accepted" \
            --reply "permission validate failed: unknown-resource-class: nope" \
            --expect-permission "derive(parent=0, retain=[network()@initial@user/roc-golem/local/roc-golem:counter/counter-agent:connect:example.test:443], lifespan=PT1H)" \
            --expect-permission "derive-scope(parents=[0]" \
            --expect-permission "drop(card)"

          # An installation the runtime refuses before it looks at the card: only
          # agent targets are supported. The same command against the harness's
          # stub shows the holder the component built (`install-self` resolves its
          # own component id and worker id).
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "permission wallet" --reply '"tag":"template"' \
            --then-message "permission install-account 1" \
            --then-reply "not-permitted: install-card currently supports only agent targets" \
            --expect-permission "install-card(card=0, target=account("

          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "permission wallet" --reply '"handle":1' \
            --then-message "permission install-self 1" \
            --then-reply "permission install: installed" \
            --expect-permission 'install-card(card=0, target=agent(stub-agent("harness")))'

          # External durable streams (`golem:agent/durable-streams`): both
          # resources' methods are `async` host imports, which this harness
          # drives (see the README), and the stub keeps a small store of its
          # own, so the appends the component makes are what its reads answer
          # with. The reply carries the JSON the effects produce — receipts with
          # the offset, epoch and sequence, a batch with the payload as text
          # plus its byte length, and the checkpoint the second read used — and
          # the recorded call shows the producer identity the app built reached
          # the host with the options it wrote.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "stream roundtrip http://stub.invalid/v1/stream/orders one two" \
            --reply 'append0={"nextOffset":"stub-7","epoch":0,"sequence":0,"closed":false}' \
            --reply 'append1={"nextOffset":"stub-13","epoch":0,"sequence":1,"closed":false}' \
            --reply 'read1={"payload":"[\"one\",\"two\"]","payloadBytes":13,"contentType":"application/json","next":{"offset":"stub-13","cursor":null},"upToDate":true,"closed":false}' \
            --reply 'from2=stub-13 read2={"payload":"[]","payloadBytes":2' \
            --reply 'released=ok' \
            --expect-stream "writer(url=http://stub.invalid/v1/stream/orders, content-type=application/json, producer=01020304-0506-0708-090a-0b0c0d0e0f10, epoch=0, timeout-ms=30000, auth=none)"

          # A single append, and a byte stream that closes in the same request:
          # the receipt's `closed` flag comes back true and the read of the
          # closed stream answers the bytes with `closed` set. The recorded
          # call shows the `bytes` payload and the close flag reaching the host.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "stream append http://stub.invalid/v1/stream/orders hello" \
            --reply 'stream append={"nextOffset":"stub-9","epoch":0,"sequence":0,"closed":false} released=ok' \
            --then-message "stream bytes http://stub.invalid/v1/stream/blob hi" \
            --then-reply 'stream append={"nextOffset":"stub-2","epoch":0,"sequence":0,"closed":true} released=ok' \
            --then-reply 'read={"payload":"hi","payloadBytes":2,"contentType":"application/octet-stream","next":{"offset":"stub-2","cursor":null},"upToDate":true,"closed":true}' \
            --expect-stream "append(url=http://stub.invalid/v1/stream/orders, producer=01020304-0506-0708-090a-0b0c0d0e0f10, sequence=0, close=false, json 1 value(s)) -> next=stub-9, epoch=0, closed=false"

          # A stream that does not exist: the service's own `not-found`,
          # rendered as `<kind>: <message>` in the effect's error channel, which
          # the app reports — and the reader is released either way.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "stream read http://stub.invalid/v1/stream/missing" \
            --reply "stream read=error(not-found: Durable Streams HTTP status 404) released=ok" \
            --expect-stream "read(url=http://stub.invalid/v1/stream/missing, offset=-1, transport=catch-up, content-type=none) -> not-found"

          # The tool export itself (`golem:tool/guest.invoke`, the surface
          # `golem tool invoke` drives) carries its stdin/stdout/stderr as
          # component-model streams, so the harness supplies the stdin bytes
          # and captures what the component writes through the two writers.
          check "$HARNESS" build/ai_tool_agent.wasm \
            --type ai-tool-agent --method calculator \
            --message hello --reply "AI assistant" \
            --tool calculator --tool-reply '{"result": 42}' \
            --tool-stream echo --tool-stdin "harness stdin bytes" \
            --expect-tool-stdout "harness stdin bytes" \
            --expect-tool-stderr "read 19 bytes of stdin"

          # A tool call's arguments are JSON, so in real use they are full of
          # quotes and backslashes — and the field reader used to end the value
          # at its first `"`. The `--tool-stdin` path goes through the same
          # reader the tool call's `arguments` field does, and the ai tool's
          # `echo` answers with the bytes it read, so the argument has to come
          # back whole (a quote, a backslash, and the `":"` text of JSON).
          check "$HARNESS" build/ai_tool_agent.wasm \
            --type ai-tool-agent --method calculator \
            --message hello --reply "AI assistant" \
            --tool-stream echo --tool-stdin '{"q":"say \"hi\"","p":"C:\\tmp"}' \
            --expect-tool-stdout '{"q":"say \"hi\"","p":"C:\\tmp"}' \
            --expect-tool-stderr "read 32 bytes of stdin"

          # An answer carrying a control character below 0x20. `serde_json`
          # refuses one written raw, and the platform's own emitter used to write
          # the byte as-is — so the invocation's stdout/stderr were dropped when
          # the host could not parse the answer. The emitter escapes them now
          # (`\u00XX`), and a vertical tab is the cheapest one to write in a
          # shell. With the emitter unfixed this check reports the stdout as empty.
          check "$HARNESS" build/ai_tool_agent.wasm \
            --type ai-tool-agent --method calculator \
            --message hello --reply "AI assistant" \
            --tool-stream echo --tool-stdin "$(printf 'a\vb')" \
            --expect-tool-stdout "$(printf 'a\vb')" \
            --expect-tool-stderr "read 3 bytes of stdin"

          # The multimodal method (`handle-multimodal`): the parts a caller sends
          # arrive as the JSON envelope the app reads, and the envelope the app
          # answers with becomes the parts the caller sees. The harness builds the
          # caller's value tree and renders the answer's tree itself, so both
          # directions are checked against the documented envelope; a value the
          # host cannot represent is refused as the invocation's error, and an
          # agent that did not declare the method is refused before the app runs
          # at all.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message increment --reply "Counter incremented to 1" \
            --multimodal '[{"tag":"text","value":{"text":"hi","language":null}},{"tag":"binary","value":{"bytes":[1,2,3],"mimeType":"image/png"}}]' \
            --expect-multimodal '"text":"count=1; text=hi; bytes=[1,2,3]; mime=image/png"' \
            --expect-multimodal '"bytes":[1,2,3],"mimeType":"image/png"'

          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent \
            --multimodal '[{"tag":"text","value":{"text":"hi"}}]' \
            --multimodal-shape-mismatch \
            --expect-multimodal-error "instead of a text value"

          check "$HARNESS" build/site_agent.wasm \
            --type file-site-agent --method handle-message \
            --message ping --reply "is serving its mount" \
            --multimodal '[{"tag":"text","value":{"text":"hi"}}]' \
            --expect-multimodal-error "declares no multimodal method"

          # The streaming agent imports an async host function
          # (`websocket/client.receive`), and the harness drives it: the input
          # stub answers the connect and records the send, so the websocket
          # effects are checked here as well as in the e2e job below.
          check "$HARNESS" build/streaming_agent_agent.wasm \
            --type streaming-agent --method stream_message \
            --message connect --reply "Connected with handle" \
            --expect-log "websocket connected" \
            --then-message hello --then-reply "Sent: hello" \
            --expect-sent hello

          # The effects agent cannot be instantiated by the harness at all: it
          # imports p3 `wasi:http/client@0.3.0` (`wasi:http/client.send`, the
          # replacement for the p2 interfaces Golem 1.6.0 dropped) and the
          # harness world implements no p3 HTTP interface. The e2e step below is
          # its authoritative check.
          # check "$HARNESS" build/effects_agent.wasm \
          #   --type effects-agent --config "http://example.test/" \
          #   --message fetch --reply "HTTP 200" \
          #   --expect-http "GET / host=example.test" \
          #   --then-message rpc --then-reply "RPC reply: stub-rpc-reply" \
          #   --expect-rpc "invoke-and-await(handle-message)"

          check "$HARNESS" build/site_agent.wasm \
            --type file-site-agent --method handle-message \
            --expect-mount "site/{id}" \
            --message ping --reply "is serving its mount"

          check "$HARNESS" build/static_site_agent.wasm \
            --type static-site-agent --expect-kind http-router \
            --expect-mount "static" --message ping --reply ""

          exit $status

      - name: Install Golem CLI
        env:
          # Keep in step with .github/workflows/ci.yaml.
          GOLEM_VERSION: v1.6.0
        run: |
          curl -fSL -o "$HOME/golem-cli" \
            "https://github.com/golemcloud/golem/releases/download/${GOLEM_VERSION}/golem-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/golem-cli"
          "$HOME/golem-cli" --version

      - name: End-to-end test
        # Deploys to a real Golem server and invokes the agents. Nothing is
        # stubbed here, so this is what proves a release actually runs.
        run: GOLEM_CLI="$HOME/golem-cli" ./tooling/e2e.sh

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Roc Golem Platform ${{ steps.vars.outputs.tag }}"
          body_path: dist/release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/*.tar.zst
            dist/*.tar.br
            dist/*.tar.gz
            dist/checksums.txt
            build/*_agent.wasm
