name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y lld brotli zstd
          if ! command -v wasm-ld &>/dev/null; then
            sudo ln -s "$(which lld)" /usr/local/bin/wasm-ld || true
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.222.0"

      - name: Cache Roc Compiler
        id: cache-roc
        uses: actions/cache@v4
        with:
          path: ~/.roc-cache
          key: roc-nightly-2026-09-29-7f11a82

      - name: Install Pinned Roc Nightly
        if: steps.cache-roc.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.roc-cache"
          curl -fsSL https://github.com/roc-lang/nightlies/releases/download/nightly-2026-09-29-7f11a82/roc_nightly-linux_x86_64-2026-09-29-7f11a82.tar.gz | tar -xz -C "$HOME/.roc-cache" --strip-components=1

      - name: Add Roc to PATH
        run: |
          echo "$HOME/.roc-cache" >> "$GITHUB_PATH"

      - name: Verify Toolchain
        run: |
          cargo --version
          rustc --version
          wasm-tools --version
          roc version

      - name: "Layer 1: Static Checks (Formatting & Linting)"
        run: |
          echo "==> Checking Rust formatting..."
          cargo fmt --manifest-path host/Cargo.toml --all -- --check
          echo "==> Running Clippy..."
          cargo clippy --manifest-path host/Cargo.toml --features stub-guest --lib -- -D warnings
          echo "==> Checking Roc formatting..."
          roc fmt --check platform/main.roc platform/Json.roc examples/counter/main.roc examples/ai_tool/main.roc examples/streaming_agent/main.roc examples/canary_release/main.roc tests/envelope.roc tests/json_roundtrip.roc
          echo "==> Running Roc checks..."
          roc check platform/main.roc || [ $? -eq 2 ]
          roc check examples/counter/main.roc || [ $? -eq 2 ]
          roc check examples/ai_tool/main.roc || [ $? -eq 2 ]
          roc check examples/streaming_agent/main.roc || [ $? -eq 2 ]
          roc check examples/canary_release/main.roc || [ $? -eq 2 ]

      - name: "Layer 2: Unit Tests (Host & Platform)"
        run: |
          echo "==> Running Host unit tests..."
          cargo test --manifest-path host/Cargo.toml --features stub-guest --lib
          echo "==> Running Roc platform tests..."
          roc test tests/envelope.roc || [ $? -eq 2 ]
          roc test tests/json_roundtrip.roc || [ $? -eq 2 ]

      - name: "Layer 3: App Builds & Packaging"
        run: |
          ./tooling/build.sh all

      - name: "Layer 4: Component Validation & Package Verification"
        run: |
          echo "==> Validating WebAssembly Component Model conformance..."
          wasm-tools validate build/counter_agent.wasm
          wasm-tools validate build/ai_tool_agent.wasm
          wasm-tools validate build/streaming_agent_agent.wasm
          wasm-tools validate build/canary_release_agent.wasm
          echo "==> Verifying release package files..."
          test -f dist/checksums.txt
          test -f dist/release_notes.md
          echo "CI Pipeline completed successfully!"
