name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  test-and-verify:
    name: Test & Verify Platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install compression tools (brotli, zstd)
        run: sudo apt-get update && sudo apt-get install -y brotli zstd

      - name: Install wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          # >= 1.248.0 is the floor for componentizing the Golem 1.6 async ABI
          # (Golem's own CI pins 1.248.0).
          version: "1.248.0"

      - name: Install Roc Nightly
        env:
          # Pinned on purpose. The Rust host in `host/src/roc_std.rs` implements
          # Roc's memory/ABI contract by hand, so a new nightly can change it
          # under us; the ABI smoke test below is what should gate a bump.
          ROC_TAG: nightly-2026-10-19-601b54c
        run: |
          ROC_VERSION="${ROC_TAG#nightly-}"
          mkdir -p "$HOME/roc"
          ROC_URL="https://github.com/roc-lang/nightlies/releases/download/${ROC_TAG}/roc_nightly-linux_x86_64-${ROC_VERSION}.tar.gz"
          curl -fSL "$ROC_URL" | tar -xz -C "$HOME/roc" --strip-components=1
          echo "$HOME/roc" >> "$GITHUB_PATH"

      - name: Run Host Unit Tests
        run: cargo test --manifest-path host/Cargo.toml --lib

      - name: Build All Platform & Agent Components
        run: ./tooling/build.sh all

      - name: Verify Package Generation
        run: |
          test -f dist/checksums.txt
          test -f dist/release_notes.md
          echo "Package build verified successfully!"

      - name: ABI smoke test
        # Runs each built component outside Golem (see tooling/abi_harness):
        # agent metadata, initialize, message round-trips, tool calls and the
        # effects the examples reach for. This is what catches the hand-written
        # ABI drifting from the pinned compiler before a release ships it.
        run: |
          cargo build --release --manifest-path tooling/abi_harness/Cargo.toml
          HARNESS=tooling/abi_harness/target/release/abi_harness
          status=0
          check() { "$@" || status=1; }

          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message increment \
            --reply "Counter incremented to 1" \
            --then-reply "Counter incremented to 2" \
            --tool get_count --tool-reply '{"count": 2}'

          # The quota and retry effects are synchronous host imports, so the
          # harness can drive them (unlike the effects agent's async HTTP
          # import): the stubs record what the component asked the host for,
          # including the retry continuation the app threaded through the JSON
          # round trip.
          check "$HARNESS" build/counter_agent.wasm \
            --type counter-agent --method get_count \
            --message "quota 6" --reply "Committed 6 units" \
            --expect-quota "commit(used=6)" \
            --then-message retry --then-reply '"countBox"' \
            --expect-retry "state=3 bytes"

          check "$HARNESS" build/ai_tool_agent.wasm \
            --type ai-tool-agent --method calculator \
            --message hello --reply "AI assistant" \
            --tool calculator --tool-reply '{"result": 42}'

          # The streaming agent imports an async host function
          # (`websocket/client.receive`), which traps inside the harness's
          # wasmtime (a fork-vs-wasmtime async-ABI gap — see
          # tooling/abi_harness/README.md). The e2e job below is the
          # authoritative check for it until that is resolved.
          # check "$HARNESS" build/streaming_agent_agent.wasm \
          #   --type streaming-agent --method stream_message \
          #   --message connect --reply "Connected with handle" \
          #   --expect-log "websocket connected" \
          #   --then-message hello --then-reply "Sent: hello" \
          #   --expect-sent hello

          # The effects agent now imports an async host function too
          # (`wasi:http/client.send`, the p3 replacement for the p2 interfaces
          # Golem 1.6.0 dropped), which traps inside the harness's wasmtime for
          # the same reason the streaming agent does (see
          # tooling/abi_harness/README.md). The e2e job below is the
          # authoritative check for it until the harness can drive async
          # imports.
          # check "$HARNESS" build/effects_agent.wasm \
          #   --type effects-agent --config "http://example.test/" \
          #   --message fetch --reply "HTTP 200" \
          #   --expect-http "GET / host=example.test" \
          #   --then-message rpc --then-reply "RPC reply: stub-rpc-reply" \
          #   --expect-rpc "invoke-and-await(handle-message)"

          # The site agent's mount is app metadata that has to survive the trip
          # to the registered agent type (the runtime serves files from it
          # without invoking the agent).
          check "$HARNESS" build/site_agent.wasm \
            --type file-site-agent --method handle-message \
            --expect-mount "site/{id}" \
            --message ping --reply "is serving its mount"

          # The static-site router: kind, its single provider method, and a
          # literal-only mount carrying the static bindings.
          check "$HARNESS" build/static_site_agent.wasm \
            --type static-site-agent --expect-kind http-router \
            --expect-mount "static" --message ping --reply ""

          # The platform has had build-sensitive ABI bugs, so the same checks
          # also run against a debug build of an effect-heavy example. The
          # effects example itself is skipped above, so this uses the site
          # example (which needs no async imports).
          # roc exits 2 when an otherwise-successful build emitted warnings
          # (the module-header deprecations); tooling/build.sh tolerates that,
          # so the debug build does too.
          roc build --debug --target=wasm32 \
            --output=build/site_debug_raw.wasm examples/site/main.roc \
            || test $? -eq 2
          wasm-tools component new build/site_debug_raw.wasm \
            -o build/site_debug_agent.wasm
          check "$HARNESS" build/site_debug_agent.wasm \
            --type file-site-agent --expect-mount "site/{id}" \
            --message ping --reply "is serving its mount"

          exit $status

  e2e:
    name: End-to-end against a real Golem server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools
        uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: "1.248.0"

      - name: Install Roc Nightly
        env:
          # Keep in step with the job above and .github/workflows/release.yaml.
          ROC_TAG: nightly-2026-10-19-601b54c
        run: |
          ROC_VERSION="${ROC_TAG#nightly-}"
          mkdir -p "$HOME/roc"
          ROC_URL="https://github.com/roc-lang/nightlies/releases/download/${ROC_TAG}/roc_nightly-linux_x86_64-${ROC_VERSION}.tar.gz"
          curl -fSL "$ROC_URL" | tar -xz -C "$HOME/roc" --strip-components=1
          echo "$HOME/roc" >> "$GITHUB_PATH"

      - name: Install Golem CLI
        env:
          # Local deploys are verified against this release: it speaks the
          # golem:agent/guest@2.0.0 protocol this platform implements.
          GOLEM_VERSION: v1.6.0
        run: |
          curl -fSL -o "$HOME/golem-cli" \
            "https://github.com/golemcloud/golem/releases/download/${GOLEM_VERSION}/golem-x86_64-unknown-linux-gnu"
          chmod +x "$HOME/golem-cli"
          "$HOME/golem-cli" --version

      - name: End-to-end test
        run: GOLEM_CLI="$HOME/golem-cli" ./tooling/e2e.sh
