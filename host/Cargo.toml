[package]
name = "roc-golem-host"
version = "1.2.0"
edition = "2021"
description = "Rust Host translation layer for Roc Golem Cloud platform"
authors = ["Samuel Iyeh <thesparq@users.noreply.github.com>", "Roc Golem Platform Contributors"]
license = "Apache-2.0"
repository = "https://github.com/thesparq/roc-golem"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
golem-rust = "3.0.3"
golem-schema = "1.6.3"
wit-bindgen = "=0.59.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"

[features]
default = []
stub-guest = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[patch.crates-io]
wit-bindgen = { git = "https://github.com/golemcloud/wit-bindgen", rev = "c0eb9d2ff0dac16cbf04f6206fc9e86cfa70f5bd", version = "=0.59.0" }
