[package]
name = "roc-golem-host"
version = "1.0.0"
edition = "2021"
description = "Rust Host translation layer for Roc Golem Cloud platform"
authors = ["Samuel Iyeh <thesparq@vmi3258764.contaboserver.net>", "Roc Golem Platform Contributors"]
license = "Apache-2.0"
repository = "https://github.com/thesparq/roc-golem"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
wit-bindgen = { version = "0.36.0", features = ["macros", "realloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
stub-guest = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
