# Golem Cloud Application Manifest
version: "1.0.0"
components:
  - name: roc-counter-agent
    source: build/counter_agent.wasm
    wit: wit/world.wit
    build:
      command: ./tooling/build.sh counter
  - name: roc-ai-tool-agent
    source: build/ai_tool_agent.wasm
    wit: wit/world.wit
    build:
      command: ./tooling/build.sh ai_tool
  - name: roc-streaming-agent
    source: build/streaming_agent_agent.wasm
    wit: wit/world.wit
    build:
      command: ./tooling/build.sh streaming_agent
