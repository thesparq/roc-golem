# Schema for IDEA:
# $schema: https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json
# Schema for vscode-yaml:
# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.6.0/golem.schema.json

manifestVersion: 1.6.0

app: roc-golem

version:
  git:
    tagPattern: "v*"
    hashFallback: true
    staticFallback: "v1.0.0"

environments:
  local:
    server: local
    version:
      git:
        allowDirty: true
  cloud:
    server: cloud
    deployment:
      versionCheck: true

# Component names use kebab-case matching the agent `name` field in Roc source.
# WASM output files use snake_case + _agent suffix (e.g. canary_release_agent.wasm).
components:
  roc-golem:canary-release:
    componentWasm: "build/canary_release_agent.wasm"
    build:
      - command: "./tooling/build.sh canary_release"
  roc-golem:counter:
    componentWasm: "build/counter_agent.wasm"
    build:
      - command: "./tooling/build.sh counter"
  roc-golem:ai-tool:
    componentWasm: "build/ai_tool_agent.wasm"
    build:
      - command: "./tooling/build.sh ai_tool"
  roc-golem:streaming-agent:
    componentWasm: "build/streaming_agent_agent.wasm"
    build:
      - command: "./tooling/build.sh streaming_agent"
